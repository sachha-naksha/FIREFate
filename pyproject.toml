[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "focalfire"
version = "0.0.1"
description = "FocalFire: Functional and Interpretable Regulatory Encoding of cell Fate decisions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akanksha Sachan" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "tqdm>=4.65",
    "joblib>=1.3",
    "networkx>=3.0",
    "h5py>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest"]
celloracle = ["celloracle"]
scanpy = ["scanpy"]
docs = [
    "sphinx>=7,<9",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "sphinx-autobuild>=2024.0.0",
    # renders the focalfire_notebooks submodule at docs/notebooks
    "myst-nb>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
