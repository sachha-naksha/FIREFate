[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firefate"
version = "0.1.0"
description = "FIREFate: Functional and Interpretable Regulatory Encoding of Fate determination"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akanksha Sachan" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "tqdm>=4.65",
    "joblib>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]
celloracle = ["celloracle"]
scanpy = ["scanpy"]
docs = [
    "sphinx>=7,<9",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "sphinx-autodoc-typehints>=2.0,<3.6",
]

[tool.setuptools.packages.find]
where = ["src"]
