# Read the Docs build configuration.
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  builder: html
  configuration: docs/conf.py
  # Strict: the three cosmetic notebook-content warnings are suppressed in conf.py,
  # so anything left is a real problem -- a broken cross-reference, a missing
  # document, a failed autodoc import.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# The notebooks live in their own repository and are rendered from here.
submodules:
  include:
    - docs/notebooks
  recursive: false
